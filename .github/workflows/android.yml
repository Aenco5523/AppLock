          # Restore the normal workflow in the verified commit so this is truly one-shot.
          original_workflow = '''name: Android CI\n\non:\n  push:\n  pull_request:\n  workflow_dispatch:\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4.2.2\n\n      - name: Set up JDK 17\n        uses: actions/setup-java@v4.7.1\n        with:\n          distribution: 'temurin'\n          java-version: '17'\n\n      - name: Give permission to executable\n        run: chmod +x gradlew\n\n      - name: Setup Android SDK\n        uses: android-actions/setup-android@v3.2.2\n\n      - name: Setup Gradle\n        uses: gradle/actions/setup-gradle@v4.4.1\n\n      - name: Build with gradle\n        run: ./gradlew clean assemble\n\n      - name: Upload debug apks\n        uses: actions/upload-artifact@v4.6.2\n        with:\n          name: app-debug\n          path: app/build/outputs/apk/debug\n\n      - name: Upload release apks\n        uses: actions/upload-artifact@v4.6.2\n        with:\n          name: app-release\n          path: app/build/outputs/apk/release\n'''
          Path('.github/workflows/android.yml').write_text(original_workflow, encoding='utf-8')

          # Show remaining direct Text literals for review without blocking the build.
          print('\nRemaining direct Text literals:')
          import re
          for kt in Path('app/src/main/java').rglob('*.kt'):
              data = kt.read_text(encoding='utf-8')
              hits = re.findall(r'Text\(\s*"([^"\\]*(?:\\.[^"\\]*)*)"', data)
