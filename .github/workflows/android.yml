name: Android CI

on:
  push:
    branches:
      - feature/samsung-routines

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Apply Korean localization and repeat-backspace patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def must_replace(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  raise RuntimeError(f'pattern not found in {path}: {old[:100]!r}')
              if expected is not None and count != expected:
                  raise RuntimeError(f'unexpected match count in {path}: {count} != {expected}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s)')

          # Common keypad: single tap deletes once; holding backspace repeats after 350 ms.
          p = 'app/src/main/java/dev/pranav/applock/features/lockscreen/ui/PasswordOverlayScreen.kt'
          must_replace(p, 'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.launch', 'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.launch', 1)
          must_replace(p, 'contentDescription = "Close",', 'contentDescription = stringResource(R.string.close_cd),')
          must_replace(p, '"Continue to $lockedAppName"', 'stringResource(R.string.continue_to_app, lockedAppName.orEmpty())')
          must_replace(
              p,
              '''            val isPressed by interactionSource.collectIsPressedAsState()\n\n            val targetColor = if (isPressed) {''',
              '''            val isPressed by interactionSource.collectIsPressedAsState()\n            var repeatedBackspace by remember(key) { mutableStateOf(false) }\n\n            LaunchedEffect(isPressed, key) {\n                if (key == "backspace" && isPressed) {\n                    repeatedBackspace = false\n                    delay(350)\n                    repeatedBackspace = true\n                    while (true) {\n                        onKeyClick(key)\n                        delay(65)\n                    }\n                }\n            }\n\n            val targetColor = if (isPressed) {''',
              1
          )
          must_replace(
              p,
              '''                onClick = {\n                    if (!disableHaptics) vibrate(context, 100)\n                    onKeyClick(key)\n                },''',
              '''                onClick = {\n                    if (key == "backspace" && repeatedBackspace) {\n                        repeatedBackspace = false\n                    } else {\n                        if (!disableHaptics) vibrate(context, 100)\n                        onKeyClick(key)\n                    }\n                },''',
              1
          )

          # Other lock screens.
          for p in [
              'app/src/main/java/dev/pranav/applock/features/lockscreen/ui/AlphanumericPasswordOverlayScreen.kt',
              'app/src/main/java/dev/pranav/applock/features/lockscreen/ui/PatternLockScreen.kt',
          ]:
              must_replace(p, 'contentDescription = "Close",', 'contentDescription = stringResource(R.string.close_cd),')
              must_replace(p, '"Continue to $lockedAppName"', 'stringResource(R.string.continue_to_app, lockedAppName.orEmpty())')

          # Main screen visible hard-coded text + refresh routine ON/OFF state when returning to app.
          p = 'app/src/main/java/dev/pranav/applock/features/applist/ui/MainScreen.kt'
          must_replace(
              p,
              '                val appLockRepository = context.appLockRepository()\n                val backend = appLockRepository.getBackendImplementation()',
              '                val appLockRepository = context.appLockRepository()\n                applockEnabled = appLockRepository.isProtectEnabled()\n                val backend = appLockRepository.getBackendImplementation()',
              1
          )
          must_replace(p, 'text = if (applockEnabled) "ON" else "OFF",', 'text = if (applockEnabled) stringResource(R.string.main_protection_on) else stringResource(R.string.main_protection_off),', 1)
          must_replace(p, 'contentDescription = "Trigger exclusions",', 'contentDescription = stringResource(R.string.main_trigger_exclusions_cd),', 1)
          must_replace(p, 'contentDescription = "Anti-Uninstall",', 'contentDescription = stringResource(R.string.main_anti_uninstall_cd),', 1)
          must_replace(p, 'contentDescription = stringResource(R.string.main_screen_search_cd) // Update ideally', 'contentDescription = stringResource(R.string.main_add_apps_cd)', 1)
          must_replace(p, 'text = "No Protected Apps",', 'text = stringResource(R.string.main_no_protected_apps_title),', 1)
          must_replace(p, 'text = "Tap the + button to selectively secure your apps.",', 'text = stringResource(R.string.main_no_protected_apps_desc),', 1)
          must_replace(p, 'text = "Select Apps",', 'text = stringResource(R.string.main_select_apps_title),', 1)
          must_replace(p, 'Text("Protect (${selectedPackages.size})")', 'Text(stringResource(R.string.main_protect_count, selectedPackages.size))', 1)
          must_replace(p, 'text = "Protected",', 'text = stringResource(R.string.main_protected_label),', 1)
          must_replace(p, 'contentDescription = "Unlock ${appName ?: "app"}",', 'contentDescription = stringResource(R.string.main_unlock_app_cd, appName ?: stringResource(R.string.default_app_name)),', 1)
          must_replace(p, 'contentDescription = "Warning",', 'contentDescription = stringResource(R.string.warning_cd),', 1)

          # Settings screen visible hard-coded text.
          p = 'app/src/main/java/dev/pranav/applock/features/settings/ui/SettingsScreen.kt'
          must_replace(p, 'val versionName = packageInfo?.versionName ?: "Unknown"', 'val versionName = packageInfo?.versionName ?: context.getString(R.string.settings_unknown_version)', 1)
          must_replace(p, 'if (unlockTimeDuration > 10_000) "Until screen off"', 'if (unlockTimeDuration > 10_000) stringResource(R.string.settings_until_screen_off)', 1)
          must_replace(p, 'Integer.MAX_VALUE -> "Until Screen Off"', 'Integer.MAX_VALUE -> stringResource(R.string.settings_until_screen_off)', 1)
          must_replace(p, 'Intent.createChooser(shareIntent, "Share audit logs")', 'Intent.createChooser(shareIntent, context.getString(R.string.settings_share_audit_logs))', 1)
          must_replace(p, 'Intent.createChooser(shareIntent, "Share logs")', 'Intent.createChooser(shareIntent, context.getString(R.string.settings_share_logs))', 1)
          must_replace(p, 'title = "Logging",', 'title = stringResource(R.string.settings_logging_title),', 1)
          must_replace(p, 'subtitle = "Enable debug logging for troubleshooting",', 'subtitle = stringResource(R.string.settings_logging_desc),', 1)
          must_replace(
              p,
              '''private fun getBackendDisplayName(backend: BackendImplementation): String {\n    return when (backend) {\n        BackendImplementation.ACCESSIBILITY -> "Accessibility Service"\n        BackendImplementation.USAGE_STATS -> "Usage Statistics"\n        BackendImplementation.SHIZUKU -> "Shizuku Service"\n    }\n}\n\nprivate fun getBackendDescription(backend: BackendImplementation): String {\n    return when (backend) {\n        BackendImplementation.ACCESSIBILITY -> "Standard method that works on most devices"\n        BackendImplementation.USAGE_STATS -> "Experimental method using app usage statistics"\n        BackendImplementation.SHIZUKU -> "Advanced method using Shizuku and internal APIs"\n    }\n}''',
              '''@Composable\nprivate fun getBackendDisplayName(backend: BackendImplementation): String {\n    return when (backend) {\n        BackendImplementation.ACCESSIBILITY -> stringResource(R.string.settings_screen_backend_implementation_accessibility_title)\n        BackendImplementation.USAGE_STATS -> stringResource(R.string.settings_screen_backend_implementation_usage_stats_title)\n        BackendImplementation.SHIZUKU -> stringResource(R.string.settings_screen_backend_implementation_shizuku_title)\n    }\n}\n\n@Composable\nprivate fun getBackendDescription(backend: BackendImplementation): String {\n    return when (backend) {\n        BackendImplementation.ACCESSIBILITY -> stringResource(R.string.settings_screen_backend_implementation_accessibility_desc)\n        BackendImplementation.USAGE_STATS -> stringResource(R.string.settings_screen_backend_implementation_usage_stats_desc)\n        BackendImplementation.SHIZUKU -> stringResource(R.string.settings_screen_backend_implementation_shizuku_desc)\n    }\n}''',
              1
          )
          must_replace(p, 'SectionTitle(text = "Links")', 'SectionTitle(text = stringResource(R.string.settings_links_title))', 1)
          must_replace(p, 'title = "Discord Community",', 'title = stringResource(R.string.settings_discord_community_title),', 1)
          must_replace(p, 'title = "Source Code",', 'title = stringResource(R.string.settings_screen_source_code_title),', 1)
          must_replace(p, 'title = "Report Issue",', 'title = stringResource(R.string.settings_report_issue_title),', 1)

          # Anti-uninstall screen.
          p = 'app/src/main/java/dev/pranav/applock/features/antiuninstall/ui/AntiUninstallScreen.kt'
          must_replace(p, 'import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.res.stringResource\n', 1)
          must_replace(p, 'import dev.pranav.applock.core.utils.appLockRepository\n', 'import dev.pranav.applock.R\nimport dev.pranav.applock.core.utils.appLockRepository\n', 1)
          must_replace(p, 'title = "Anti-Uninstall Protection",', 'title = stringResource(R.string.settings_screen_anti_uninstall_title),', 1)
          must_replace(p, 'text = "Select apps that will be protected from uninstallation.",', 'text = stringResource(R.string.anti_uninstall_select_apps_desc),', 1)
          must_replace(p, 'text = "Manually Added Packages",', 'text = stringResource(R.string.common_manual_packages_title),', 1)
          must_replace(p, 'text = "Installed Apps",', 'text = stringResource(R.string.common_installed_apps_title),', 1)
          must_replace(p, 'title = { Text("Add Package Manually") },', 'title = { Text(stringResource(R.string.common_add_package_manually_title)) },', 1)
          must_replace(p, 'text = "Enter the package name of the app you want to protect:",', 'text = stringResource(R.string.anti_uninstall_enter_package_desc),', 1)
          must_replace(p, 'label = { Text("Package Name") },', 'label = { Text(stringResource(R.string.common_package_name)) },', 1)
          must_replace(p, ') { Text("Add") }', ') { Text(stringResource(R.string.common_add_button)) }', 1)
          must_replace(p, 'TextButton(onClick = { showManualAddDialog.value = false }) { Text("Cancel") }', 'TextButton(onClick = { showManualAddDialog.value = false }) { Text(stringResource(R.string.cancel_button)) }', 1)
          must_replace(p, 'ShizukuState.NOT_INSTALLED -> "Shizuku Not Installed"', 'ShizukuState.NOT_INSTALLED -> stringResource(R.string.shizuku_not_installed_title)', 1)
          must_replace(p, 'ShizukuState.NOT_RUNNING -> "Shizuku Not Running"', 'ShizukuState.NOT_RUNNING -> stringResource(R.string.shizuku_not_running_title)', 1)
          must_replace(p, 'ShizukuState.PERMISSION_DENIED -> "Permission Required"', 'ShizukuState.PERMISSION_DENIED -> stringResource(R.string.settings_screen_permission_required_dialog_title)', 1)
          must_replace(p, 'else -> "Shizuku Setup"', 'else -> stringResource(R.string.shizuku_setup_title)', 1)
          must_replace(p, 'ShizukuState.NOT_INSTALLED -> "Shizuku is required to configure Anti-Uninstall protection without root.\\n\\nPlease install Shizuku from the Play Store or GitHub to continue."', 'ShizukuState.NOT_INSTALLED -> stringResource(R.string.shizuku_not_installed_desc)', 1)
          must_replace(p, 'ShizukuState.NOT_RUNNING -> "Shizuku is installed, but the background service has not been started yet (Binder hasn\'t been received).\\n\\nPlease open the Shizuku application and start the service via Wireless Debugging or Root."', 'ShizukuState.NOT_RUNNING -> stringResource(R.string.shizuku_not_running_desc)', 1)
          must_replace(p, 'ShizukuState.PERMISSION_DENIED -> "Shizuku is active, but this application needs your permission authorization to configure package restrictions.\\n\\nThankfully, Shizuku is only used while blocking/unblocking uninstalls, so it doesn\'t need to stay running forever!"', 'ShizukuState.PERMISSION_DENIED -> stringResource(R.string.shizuku_permission_desc)', 1)
          must_replace(p, 'ShizukuState.NOT_INSTALLED -> "Install Shizuku"', 'ShizukuState.NOT_INSTALLED -> stringResource(R.string.install_shizuku_button)', 1)
          must_replace(p, 'ShizukuState.NOT_RUNNING -> "Open Shizuku"', 'ShizukuState.NOT_RUNNING -> stringResource(R.string.open_shizuku_button)', 1)
          must_replace(p, 'ShizukuState.PERMISSION_DENIED -> "Grant Permission"', 'ShizukuState.PERMISSION_DENIED -> stringResource(R.string.grant_permission_button)', 1)
          must_replace(p, 'else -> "Confirm"', 'else -> stringResource(R.string.confirm_button)', 1)
          must_replace(p, '}) { Text("Go Back") }', '}) { Text(stringResource(R.string.go_back_button)) }', 1)
          must_replace(p, 'contentDescription = "Back"', 'contentDescription = stringResource(R.string.settings_screen_back_cd)', 1)
          must_replace(p, 'contentDescription = "Add package manually"', 'contentDescription = stringResource(R.string.common_add_package_manually_cd)', 1)
          must_replace(p, 'placeholder = { Text("Search apps or package names...") }', 'placeholder = { Text(stringResource(R.string.common_search_apps_packages)) }', 1)
          must_replace(p, 'text = "Manually added package",', 'text = stringResource(R.string.common_manually_added_package),', 1)

          # Trigger exclusions screen.
          p = 'app/src/main/java/dev/pranav/applock/features/triggerexclusions/ui/TriggerExclusionsScreen.kt'
          must_replace(p, 'import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.res.stringResource\n', 1)
          must_replace(p, 'import dev.pranav.applock.features.applist.domain.AppInfo\n', 'import dev.pranav.applock.R\nimport dev.pranav.applock.features.applist.domain.AppInfo\n', 1)
          must_replace(p, 'title = "Trigger Exclusions",', 'title = stringResource(R.string.trigger_exclusions_title),', 1)
          must_replace(p, 'text = "Select apps that will NOT trigger locks when switching to locked apps.",', 'text = stringResource(R.string.trigger_exclusions_desc),', 1)
          must_replace(p, 'text = "Manually Added Packages",', 'text = stringResource(R.string.common_manual_packages_title),', 1)
          must_replace(p, 'text = "Installed Apps",', 'text = stringResource(R.string.common_installed_apps_title),', 1)
          must_replace(p, 'title = { Text("Add Package Manually") },', 'title = { Text(stringResource(R.string.common_add_package_manually_title)) },', 1)
          must_replace(p, 'text = "Enter the package name of the app you want to exclude:",', 'text = stringResource(R.string.trigger_exclusions_enter_package_desc),', 1)
          must_replace(p, 'label = { Text("Package Name") },', 'label = { Text(stringResource(R.string.common_package_name)) },', 1)
          must_replace(p, ') { Text("Add") }', ') { Text(stringResource(R.string.common_add_button)) }', 1)
          must_replace(p, 'TextButton(onClick = { showManualAddDialog.value = false }) { Text("Cancel") }', 'TextButton(onClick = { showManualAddDialog.value = false }) { Text(stringResource(R.string.cancel_button)) }', 1)
          must_replace(p, 'contentDescription = "Back"', 'contentDescription = stringResource(R.string.settings_screen_back_cd)', 1)
          must_replace(p, 'contentDescription = "Add package manually"', 'contentDescription = stringResource(R.string.common_add_package_manually_cd)', 1)
          must_replace(p, 'placeholder = { Text("Search apps or package names...") }', 'placeholder = { Text(stringResource(R.string.common_search_apps_packages)) }', 1)
          must_replace(p, 'text = "Manually added package",', 'text = stringResource(R.string.common_manually_added_package),', 1)

          # Pattern setup screen had several English literals and PIN wording.
          p = 'app/src/main/java/dev/pranav/applock/features/setpassword/ui/PatternSetPasswordScreen.kt'
          must_replace(p, 'isVerifyOldPasswordMode -> stringResource(R.string.enter_current_pin_title)', 'isVerifyOldPasswordMode -> stringResource(R.string.pattern_enter_current_title)', 1)
          must_replace(p, 'isConfirmationMode -> stringResource(R.string.confirm_pin_title)', 'isConfirmationMode -> stringResource(R.string.pattern_confirm_title)', 1)
          must_replace(p, 'else -> stringResource(R.string.set_new_pin_title)', 'else -> stringResource(R.string.pattern_create_title)', 1)
          must_replace(p, 'isVerifyOldPasswordMode -> "Enter current Pattern"', 'isVerifyOldPasswordMode -> stringResource(R.string.pattern_enter_current_title)', 1)
          must_replace(p, 'isConfirmationMode -> "Confirm pattern"', 'isConfirmationMode -> stringResource(R.string.pattern_confirm_title)', 1)
          must_replace(p, 'else -> "Create a pattern"', 'else -> stringResource(R.string.pattern_create_title)', 1)
          must_replace(p, 'text = "Incorrect Pattern",', 'text = stringResource(R.string.pattern_incorrect_error),', 1)
          must_replace(p, 'text = "Patter length should be at least 4",', 'text = stringResource(R.string.pattern_min_length_error),', 2)
          must_replace(p, 'text = "Incorrect pattern",', 'text = stringResource(R.string.pattern_incorrect_error),', 2)
          must_replace(p, 'isVerifyOldPasswordMode -> stringResource(R.string.enter_current_pin_label)', 'isVerifyOldPasswordMode -> stringResource(R.string.pattern_enter_current_title)', 1)
          must_replace(p, 'isConfirmationMode -> stringResource(R.string.confirm_new_pin_label)', 'isConfirmationMode -> stringResource(R.string.pattern_confirm_title)', 1)
          must_replace(p, 'else -> stringResource(R.string.create_new_pin_label)', 'else -> stringResource(R.string.pattern_create_title)', 1)

          default_extra = '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="close_cd">Close</string>\n    <string name="continue_to_app">Continue to %1$s</string>\n    <string name="main_protection_on">ON</string>\n    <string name="main_protection_off">OFF</string>\n    <string name="main_trigger_exclusions_cd">Trigger exclusions</string>\n    <string name="main_anti_uninstall_cd">Anti-Uninstall</string>\n    <string name="main_add_apps_cd">Add protected apps</string>\n    <string name="main_no_protected_apps_title">No Protected Apps</string>\n    <string name="main_no_protected_apps_desc">Tap the + button to selectively secure your apps.</string>\n    <string name="main_select_apps_title">Select Apps</string>\n    <string name="main_protect_count">Protect (%1$d)</string>\n    <string name="main_protected_label">Protected</string>\n    <string name="main_unlock_app_cd">Unlock %1$s</string>\n    <string name="warning_cd">Warning</string>\n    <string name="settings_unknown_version">Unknown</string>\n    <string name="settings_until_screen_off">Until screen off</string>\n    <string name="settings_share_audit_logs">Share audit logs</string>\n    <string name="settings_share_logs">Share logs</string>\n    <string name="settings_logging_title">Logging</string>\n    <string name="settings_logging_desc">Enable debug logging for troubleshooting</string>\n    <string name="settings_links_title">Links</string>\n    <string name="settings_discord_community_title">Discord Community</string>\n    <string name="settings_report_issue_title">Report Issue</string>\n    <string name="common_manual_packages_title">Manually Added Packages</string>\n    <string name="common_installed_apps_title">Installed Apps</string>\n    <string name="common_add_package_manually_title">Add Package Manually</string>\n    <string name="common_package_name">Package Name</string>\n    <string name="common_add_button">Add</string>\n    <string name="common_search_apps_packages">Search apps or package names…</string>\n    <string name="common_manually_added_package">Manually added package</string>\n    <string name="common_add_package_manually_cd">Add package manually</string>\n    <string name="anti_uninstall_select_apps_desc">Select apps that will be protected from uninstallation.</string>\n    <string name="anti_uninstall_enter_package_desc">Enter the package name of the app you want to protect:</string>\n    <string name="shizuku_not_installed_title">Shizuku Not Installed</string>\n    <string name="shizuku_not_running_title">Shizuku Not Running</string>\n    <string name="shizuku_setup_title">Shizuku Setup</string>\n    <string name="shizuku_not_installed_desc">Shizuku is required to configure Anti-Uninstall protection without root.\n\nInstall Shizuku from the Play Store or GitHub to continue.</string>\n    <string name="shizuku_not_running_desc">Shizuku is installed, but its background service has not started yet.\n\nOpen Shizuku and start the service using Wireless Debugging or Root.</string>\n    <string name="shizuku_permission_desc">Shizuku is active, but App Lock needs permission to configure package restrictions.\n\nShizuku is only used when blocking or unblocking uninstall operations.</string>\n    <string name="install_shizuku_button">Install Shizuku</string>\n    <string name="open_shizuku_button">Open Shizuku</string>\n    <string name="go_back_button">Go Back</string>\n    <string name="trigger_exclusions_title">Trigger Exclusions</string>\n    <string name="trigger_exclusions_desc">Select apps that will not trigger locks when switching to locked apps.</string>\n    <string name="trigger_exclusions_enter_package_desc">Enter the package name of the app you want to exclude:</string>\n    <string name="pattern_enter_current_title">Enter current pattern</string>\n    <string name="pattern_confirm_title">Confirm pattern</string>\n    <string name="pattern_create_title">Create a pattern</string>\n    <string name="pattern_incorrect_error">Incorrect pattern</string>\n    <string name="pattern_min_length_error">Pattern must contain at least 4 dots.</string>\n</resources>\n'''

          korean_extra = '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="close_cd">닫기</string>\n    <string name="continue_to_app">%1$s로 계속</string>\n    <string name="main_protection_on">켜짐</string>\n    <string name="main_protection_off">꺼짐</string>\n    <string name="main_trigger_exclusions_cd">트리거 제외</string>\n    <string name="main_anti_uninstall_cd">삭제 방지</string>\n    <string name="main_add_apps_cd">보호할 앱 추가</string>\n    <string name="main_no_protected_apps_title">보호된 앱 없음</string>\n    <string name="main_no_protected_apps_desc">+ 버튼을 눌러 보호할 앱을 추가하세요.</string>\n    <string name="main_select_apps_title">앱 선택</string>\n    <string name="main_protect_count">보호 (%1$d)</string>\n    <string name="main_protected_label">보호됨</string>\n    <string name="main_unlock_app_cd">%1$s 잠금 해제</string>\n    <string name="warning_cd">경고</string>\n    <string name="settings_unknown_version">알 수 없음</string>\n    <string name="settings_until_screen_off">화면이 꺼질 때까지</string>\n    <string name="settings_share_audit_logs">보안 로그 공유</string>\n    <string name="settings_share_logs">로그 공유</string>\n    <string name="settings_logging_title">로깅</string>\n    <string name="settings_logging_desc">문제 해결을 위한 디버그 로그를 기록합니다.</string>\n    <string name="settings_links_title">링크</string>\n    <string name="settings_discord_community_title">Discord 커뮤니티</string>\n    <string name="settings_report_issue_title">문제 신고</string>\n    <string name="common_manual_packages_title">직접 추가한 패키지</string>\n    <string name="common_installed_apps_title">설치된 앱</string>\n    <string name="common_add_package_manually_title">패키지 직접 추가</string>\n    <string name="common_package_name">패키지 이름</string>\n    <string name="common_add_button">추가</string>\n    <string name="common_search_apps_packages">앱 또는 패키지 이름 검색…</string>\n    <string name="common_manually_added_package">직접 추가한 패키지</string>\n    <string name="common_add_package_manually_cd">패키지 직접 추가</string>\n    <string name="anti_uninstall_select_apps_desc">삭제되지 않도록 보호할 앱을 선택하세요.</string>\n    <string name="anti_uninstall_enter_package_desc">보호할 앱의 패키지 이름을 입력하세요.</string>\n    <string name="shizuku_not_installed_title">Shizuku가 설치되지 않음</string>\n    <string name="shizuku_not_running_title">Shizuku가 실행 중이 아님</string>\n    <string name="shizuku_setup_title">Shizuku 설정</string>\n    <string name="shizuku_not_installed_desc">루트 없이 삭제 방지 보호를 설정하려면 Shizuku가 필요합니다.\n\n계속하려면 Shizuku를 설치하세요.</string>\n    <string name="shizuku_not_running_desc">Shizuku는 설치되어 있지만 백그라운드 서비스가 아직 시작되지 않았습니다.\n\nShizuku를 열고 무선 디버깅 또는 Root로 서비스를 시작하세요.</string>\n    <string name="shizuku_permission_desc">Shizuku가 실행 중이지만 패키지 제한을 설정하려면 App Lock 권한이 필요합니다.\n\nShizuku는 앱 삭제 차단 또는 해제 작업을 할 때만 사용됩니다.</string>\n    <string name="install_shizuku_button">Shizuku 설치</string>\n    <string name="open_shizuku_button">Shizuku 열기</string>\n    <string name="go_back_button">돌아가기</string>\n    <string name="trigger_exclusions_title">트리거 제외</string>\n    <string name="trigger_exclusions_desc">잠긴 앱으로 전환할 때 잠금 화면을 발생시키지 않을 앱을 선택하세요.</string>\n    <string name="trigger_exclusions_enter_package_desc">제외할 앱의 패키지 이름을 입력하세요.</string>\n    <string name="pattern_enter_current_title">현재 패턴 입력</string>\n    <string name="pattern_confirm_title">패턴 확인</string>\n    <string name="pattern_create_title">새 패턴 만들기</string>\n    <string name="pattern_incorrect_error">패턴이 올바르지 않습니다.</string>\n    <string name="pattern_min_length_error">패턴은 최소 4개 점을 연결해야 합니다.</string>\n</resources>\n'''

