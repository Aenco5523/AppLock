      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Build with gradle
        run: ./gradlew clean assemble

      - name: Commit verified patch
        if: success()
        shell: bash
        run: |
          git config user.name "Aenco"
          git config user.email "161310162+Aenco5523@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Complete Korean localization and repeat backspace [skip ci]"
            git push origin HEAD:feature/samsung-routines
          fi

      - name: Upload debug apks
        uses: actions/upload-artifact@v4.6.2
        with:
